<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeSpace</title>
  <style>
    :root{
      --bg:#212121;
      --panel:#2b2b2b;
      --panel-2:#2f2f2f;
      --text:#ececec;
      --muted:#8e8e8e;
      --border2:rgba(255,255,255,.08);
      --accent:#10a37f;
      --font:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:var(--font);
      background:var(--bg);
      color:var(--text);
      overflow:hidden;
    }

    #app{height:100vh;background:var(--bg)}
    .layout{display:flex;height:100%}

    .sb{
      width:280px;
      background:var(--panel);
      border-right:1px solid var(--border2);
      display:flex;
      flex-direction:column;
      transition:.25s ease;
    }

    .sb-top{padding:1rem;border-bottom:1px solid var(--border2)}
    .nchat-btn{
      width:100%;
      background:var(--panel-2);
      color:var(--text);
      border:1px solid var(--border2);
      border-radius:10px;
      padding:.85rem 1rem;
      text-align:left;
      cursor:pointer;
      font-size:.95rem;
    }

    .sb-nav,.sb-list,.sb-bottom{padding:.75rem}
    .ni,.sitem,.urow{
      display:flex;
      align-items:center;
      gap:.75rem;
      width:100%;
      padding:.8rem .9rem;
      border-radius:10px;
      color:var(--text);
      background:transparent;
      border:none;
      text-align:left;
      cursor:pointer;
      font-size:.94rem;
    }

    .ni:hover,.sitem:hover,.urow:hover{background:rgba(255,255,255,.07)}
    .sb-list{flex:1;overflow:auto}
    .slabel{font-size:.78rem;color:var(--muted);padding:.25rem .9rem .5rem}

    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      min-width:0;
      background:var(--bg);
    }

    .hdr{
      padding:.75rem 1rem;
      border-bottom:1px solid var(--border2);
      display:flex;
      align-items:center;
      gap:.75rem;
      flex-shrink:0;
      background:#212121;
    }

    .mob-menu{
      display:none;
      background:none;
      border:none;
      color:#b4b4b4;
      cursor:pointer;
      padding:.2rem;
      font-size:1.2rem;
    }

    .hdr-title{
      font-size:1rem;
      font-weight:600;
      color:#ececec;
    }

    .hdr-right{margin-left:auto;color:var(--muted);font-size:.9rem}
    .msgs{flex:1;overflow:auto;padding:.5rem 0;background:var(--bg)}
    .mwrap{padding:.5rem 1rem}

    .welcome{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      flex:1;
      padding:2rem 1rem;
      text-align:center;
      background:#212121;
      min-height:100%;
    }

    .wic{display:none}
    .wtitle{
      font-size:2rem;
      font-weight:500;
      color:#ececec;
      letter-spacing:-0.03em;
      margin-bottom:.4rem;
    }

    .wsub{
      font-size:.9rem;
      color:#8e8e8e;
      max-width:320px;
      line-height:1.6;
      min-height:1.4em;
    }

    .iarea{
      padding:.65rem .8rem 1rem;
      flex-shrink:0;
      background:#212121;
      border-top:1px solid rgba(255,255,255,.03);
    }

    .ibox{
      max-width:760px;
      margin:0 auto;
      background:#2f2f2f;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:28px;
      position:relative;
      min-height:56px;
      display:flex;
      align-items:center;
    }

    .cinput{
      width:100%;
      padding:.95rem 4rem .95rem 1rem;
      background:none;
      border:none;
      color:#ececec;
      font-family:var(--font);
      font-size:.95rem;
      resize:none;
      outline:none;
      min-height:56px;
      max-height:160px;
      line-height:1.4;
    }

    .cinput::placeholder{color:#8e8e8e}

    .sbtn{
      position:absolute;
      right:.55rem;
      bottom:.55rem;
      width:38px;
      height:38px;
      border-radius:50%;
      background:#10a37f;
      border:none;
      color:#fff;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1rem;
    }

    .pg{display:none}
    .pg.on{display:block}
    .spg{padding:1rem;color:var(--muted)}

    .sbov{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.6);
      z-index:99;
    }

    .sbov.on{display:block}

    .mobbar{display:none !important}

    .mobfab{
      display:none;
      position:fixed;
      bottom:20px;
      right:18px;
      width:56px;
      height:56px;
      border-radius:50%;
      background:var(--accent);
      color:#fff;
      border:none;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 8px 24px rgba(16,163,127,.35);
      z-index:50;
      font-size:1.35rem;
    }

    .mobfab.hide{display:none !important}

    @media(max-width:768px){
      html,body{
        height:100dvh;
        overflow:hidden;
        background:#212121;
      }

      #app{
        height:100dvh;
        overflow:hidden;
        background:#212121;
      }

      .layout{
        height:100%;
        flex-direction:column;
        overflow:hidden;
      }

      .sb{
        display:none !important;
      }

      .sb.mopen{
        display:flex !important;
        position:fixed;
        top:0;
        left:0;
        bottom:0;
        width:78%;
        max-width:300px;
        background:#2f2f2f;
        z-index:100;
        box-shadow:0 10px 30px rgba(0,0,0,.45);
      }

      .main{
        flex:1;
        width:100%;
        display:flex;
        flex-direction:column;
        overflow:hidden;
        min-height:0;
        background:#212121;
      }

      .hdr{
        padding:.75rem 1rem;
        background:#212121;
        border-bottom:1px solid rgba(255,255,255,0.06);
      }

      .mob-menu{display:flex !important}
      .hdr-right{display:none}

      .msgs{
        padding:.2rem 0;
        flex:1;
        overflow-y:auto;
        background:#212121;
      }

      .mwrap{padding:.35rem .85rem}

      .welcome{
        flex:1;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:2rem 1rem;
        background:#212121;
      }

      .wtitle{
        font-size:2rem;
        font-weight:500;
        color:#ececec;
      }

      .wsub{
        color:#8e8e8e;
        font-size:.9rem;
      }

      .iarea{
        padding:.7rem .8rem 1rem;
        background:#212121;
      }

      .ibox{
        background:#2f2f2f;
        border:1px solid rgba(255,255,255,0.08);
        border-radius:28px;
        min-height:56px;
      }

      .cinput{
        min-height:56px;
        padding:.95rem 4rem .95rem 1rem;
        font-size:.95rem;
      }

      .sbtn{
        width:38px;
        height:38px;
        border-radius:50%;
        right:.55rem;
        bottom:.55rem;
      }

      .spg{
        padding:.85rem;
        flex:1;
        overflow-y:auto;
        background:#212121;
      }

      .pg{height:100%}

      .pg.on{
        display:flex;
        flex-direction:column;
        flex:1;
        overflow:hidden;
        min-height:0;
      }

      .mobbar{display:none !important}

      .mobfab{
        display:flex !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="sbov" id="overlay" onclick="toggleSidebar(false)"></div>
    <div class="layout">
      <aside class="sb" id="sidebar">
        <div class="sb-top">
          <button class="nchat-btn" onclick="showPage('chat')">+ New chat</button>
        </div>

        <div class="sb-nav">
          <button class="ni" onclick="showPage('chat')">💬 Chat</button>
          <button class="ni" onclick="showPage('history')">🕘 History</button>
          <button class="ni" onclick="showPage('mood')">😊 Mood tracker</button>
          <button class="ni" onclick="showPage('exercises')">🧘 Exercises</button>
        </div>

        <div class="sb-list">
          <div class="slabel">Recent</div>
          <button class="sitem">Anxiety support</button>
          <button class="sitem">Sleep tips</button>
          <button class="sitem">Breathing routine</button>
        </div>

        <div class="sb-bottom">
          <button class="urow">👤 Profile</button>
        </div>
      </aside>

      <main class="main">
        <header class="hdr">
          <button class="mob-menu" onclick="toggleSidebar(true)">☰</button>
          <div class="hdr-title" id="htitle">SafeSpace</div>
          <div class="hdr-right">Mental Health Companion</div>
        </header>

        <section class="pg on" id="page-chat">
          <div class="msgs">
            <div class="welcome">
              <div class="wic"></div>
              <div class="wtitle">Ready when you are.</div>
              <div class="wsub"></div>
            </div>
          </div>

          <div class="iarea">
            <div class="ibox">
              <textarea class="cinput" placeholder="Message SafeSpace..." rows="1"></textarea>
              <button class="sbtn">➤</button>
            </div>
          </div>
        </section>

        <section class="pg" id="page-history">
          <div class="spg">Your previous chats will appear here.</div>
        </section>

        <section class="pg" id="page-mood">
          <div class="spg">Track your mood and daily reflections here.</div>
        </section>

        <section class="pg" id="page-exercises">
          <div class="spg">Breathing, grounding, and mindfulness exercises appear here.</div>
        </section>
      </main>
    </div>

    <button class="mobfab" id="fab" onclick="showPage('chat')">＋</button>
  </div>

  <script>
    const TITLES = {
      chat: 'SafeSpace',
      history: 'History',
      mood: 'Mood tracker',
      exercises: 'Exercises'
    };

    function showPage(page){
      document.querySelectorAll('.pg').forEach(el => el.classList.remove('on'));
      document.getElementById(`page-${page}`).classList.add('on');
      document.getElementById('htitle').textContent = TITLES[page] || 'SafeSpace';

      const fab = document.getElementById('fab');
      if(page === 'chat') fab.classList.remove('hide');
      else fab.classList.add('hide');

      toggleSidebar(false);
    }

    function toggleSidebar(open){
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('overlay');
      if(window.innerWidth <= 768){
        if(open){
          sb.classList.add('mopen');
          ov.classList.add('on');
        }else{
          sb.classList.remove('mopen');
          ov.classList.remove('on');
        }
      }
    }

    const textarea = document.querySelector('.cinput');
    textarea.addEventListener('input', function(){
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 160) + 'px';
    });
  </script>
</body>
</html>
